<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 207" role="img" aria-labelledby="label">
<title id="label">两台 PE 分别用 Ethernet0 和 Ethernet2 建立主备 MPLS 核心链路</title>
<style>text{font:14px Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#183148}.name{font-size:17px;font-weight:700}.port{font:13px Consolas,monospace;fill:#15517f}.note{font-size:13px;fill:#415971}.device{fill:#e9f4fd;stroke:#28628e;stroke-width:2}.symbol{fill:none;stroke:#28628e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wire{fill:none;stroke:#476781;stroke-width:2}.logical{stroke:#30768f;stroke-dasharray:7 5}</style>
<rect x="1" y="1" width="818" height="205" rx="12" fill="#fcfdff" stroke="#cedbe7"/>
<path class="wire" d="M149 92 L671 92"/>
<text x="410" y="83" text-anchor="middle" class="note">主链路 · 192.0.2.0/30</text>
<text x="157" y="78" text-anchor="start" class="port">Ethernet0</text>
<text x="663" y="78" text-anchor="end" class="port">Ethernet0</text>
<path class="wire" d="M149 115 L671 115"/>
