<text x="120" y="145" text-anchor="middle" class="name">PE1</text>
<text x="120" y="165" text-anchor="middle" class="note">VPN BLUE</text>
<text x="120" y="182" text-anchor="middle" class="note">备用 192.0.2.5/30</text>
<g transform="translate(700 104)"><ellipse class="device" cx="0" cy="0" rx="32" ry="21"/><path class="symbol" d="M-17 -8h12m-12 0 4-4m-4 4 4 4M17 -8H5m12 0-4-4m4 4-4 4M-5 9h-12m12 0-4-4m4 4-4 4M5 9h12m-12 0 4-4m-4 4 4 4"/></g>
