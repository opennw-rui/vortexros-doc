<rect x="1" y="1" width="1089" height="168" rx="10" fill="#fcfdff" stroke="#cedbe7"/>
<g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle" dominant-baseline="middle">
<rect x="18" y="42" width="188" height="86" rx="9" fill="#e9f3fc" stroke="#457aa5"/>
<text x="112" y="85" font-size="16" fill="#19374f">CE1</text>
<rect x="307" y="42" width="188" height="86" rx="9" fill="#e9f3fc" stroke="#457aa5"/>
<text x="401" y="85" font-size="16" fill="#19374f">PE1 VPN BLUE</text>
